# Railway: 저장소 루트를 Root Directory로 두고 배포하세요.
# 빌드 로그의 `npm warn config production Use --omit=dev instead` 는 npm 10 경고이며,
# `nixpacks.toml` / `.npmrc` 로 omit=dev 를 쓰면 대부분 사라집니다. Variables에
# NPM_CONFIG_PRODUCTION=true 를 넣지 마세요(구식 설정).
# `npm start`는 package.json에서 `tsx server/index.ts`(Express)를 실행합니다.
# Root Directory를 `server/`로 지정하면 루트 package.json을 못 찾아 실패할 수 있습니다.
#
# PORT: Railway가 자동으로 지정(로그에 8080 등으로 보일 수 있음). Variables에 PORT=3001을
# 넣어도 플랫폼이 다른 값을 주면 그 값에 맞춰 바인딩해야 하며, 서버는 `process.env.PORT`를 사용합니다.
# 공개 URL은 호스트만 쓰면 되고(HTTPS), 컨테이너 내부 포트는 Railway 설정을 따릅니다.

# API 프로세스 안에서 outbox 릴레이(5초 폴링)가 기본 기동됩니다.
# 전용 워커 서비스로 분리할 때: startCommand = "npm run worker:outbox"
# 그리고 API 쪽 Variables에 OUTBOX_RELAY_DISABLED=1 을 설정하세요.

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
