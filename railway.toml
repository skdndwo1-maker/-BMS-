# Railway: 저장소 루트를 Root Directory로 두고 배포하세요.
# `npm start`는 package.json에서 `tsx server/index.ts`(Express)를 실행합니다.
# Root Directory를 `server/`로 지정하면 루트 package.json을 못 찾아 실패할 수 있습니다.
#
# PORT: Railway가 자동으로 지정(로그에 8080 등으로 보일 수 있음). Variables에 PORT=3001을
# 넣어도 플랫폼이 다른 값을 주면 그 값에 맞춰 바인딩해야 하며, 서버는 `process.env.PORT`를 사용합니다.
# 공개 URL은 호스트만 쓰면 되고(HTTPS), 컨테이너 내부 포트는 Railway 설정을 따릅니다.

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
